      <stop offset="0" stop-color="#0b1a44"/>
      <stop offset="1" stop-color="#04060d"/>
    </linearGradient>
    <linearGradient id="k" x1="350" y1="280" x2="1130" y2="1110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8ff3ff"/>
