<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">Karmine Corp Score</title>
  <desc id="d">Bannière du projet : matchs, scores et rediffs de la Karmine Corp</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a44"/>
      <stop offset=".55" stop-color="#05070f"/>
      <stop offset="1" stop-color="#1b0f3d"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a6bff"/>
      <stop offset=".55" stop-color="#3fd4ff"/>
      <stop offset="1" stop-color="#8b5cff"/>
    </linearGradient>
    <radialGradient id="blob1" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2a6bff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#2a6bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#8b5cff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#8b5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".05"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="36" fill="url(#bg)"/>
  <circle cx="200" cy="60" r="320" fill="url(#blob1)"/>
  <circle cx="1040" cy="380" r="340" fill="url(#blob2)"/>

  <!-- Logo -->
  <rect x="110" y="120" width="150" height="150" rx="42" fill="url(#grad)"/>
  <text x="185" y="222" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="78" font-weight="900" fill="#fff">KC</text>

  <!-- Titre -->
  <text x="300" y="186" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="66" font-weight="900" fill="#f6f8ff" letter-spacing="-1.5">Karmine Corp <tspan fill="url(#grad)">Score</tspan></text>
  <text x="302" y="236" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="28" font-weight="600" fill="#e1e8ff" fill-opacity=".75">Matchs · scores · scoreboards · rediffs</text>

  <!-- Pastilles -->
  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#f6f8ff">
    <rect x="302" y="268" width="190" height="52" rx="26" fill="url(#glass)" stroke="#fff" stroke-opacity=".25"/>
    <text x="397" y="303" text-anchor="middle">🔴 En direct</text>
    <rect x="508" y="268" width="170" height="52" rx="26" fill="url(#glass)" stroke="#fff" stroke-opacity=".25"/>
    <text x="593" y="303" text-anchor="middle">🏆 Tableau</text>
    <rect x="694" y="268" width="180" height="52" rx="26" fill="url(#glass)" stroke="#fff" stroke-opacity=".25"/>
    <text x="784" y="303" text-anchor="middle">🎬 Rediffs</text>
  </g>

  <!-- Petite carte de score -->
  <g transform="translate(860 72)">
    <rect width="260" height="150" rx="28" fill="url(#glass)" stroke="#fff" stroke-opacity=".3"/>
    <text x="130" y="38" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="2" fill="#e1e8ff" fill-opacity=".7">WORLDS · FINALE</text>
    <text x="130" y="112" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="58" font-weight="900" fill="url(#grad)">2 – 0</text>
    <text x="130" y="138" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#e1e8ff" fill-opacity=".8">KC · MKOI 🎉</text>
  </g>

  <text x="1160" y="382" text-anchor="end" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#e1e8ff" fill-opacity=".6">#KarmineCorp 💙</text>
  <text x="620" y="60" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" fill="#e1e8ff" fill-opacity=".5">✨ kc-live.vercel.app ✨</text>
</svg>
